		<script>
		  function formatDuration() {
		    const start = new Date(2018, 2, 15, 0, 0, 0); 
		    const now = new Date();

		    let diffMs = now - start;
		    if (diffMs < 0) return "0时0分0秒";

		    const totalSeconds = diffMs / 1000;

		    const years   = Math.floor(totalSeconds / (365.25 * 24 * 60 * 60));
		    let remaining = totalSeconds % (365.25 * 24 * 60 * 60);

		    const months  = Math.floor(remaining / (30.437 * 24 * 60 * 60));
		    remaining     = remaining % (30.437 * 24 * 60 * 60);

		    const days    = Math.floor(remaining / (24 * 60 * 60));
		    remaining     = remaining % (24 * 60 * 60);

		    const hours   = Math.floor(remaining / 3600);
		    remaining     = remaining % 3600;

		    const minutes = Math.floor(remaining / 60);
		    const seconds = Math.floor(remaining % 60);

		    let parts = [];
		    if (years   > 0) parts.push(`${years}年`);
		    if (months  > 0) parts.push(`${months}月`);
		    if (days    > 0) parts.push(`${days}天`);
		    parts.push(`${hours}时${minutes}分${seconds}秒`);

		    return parts.join("");
		  }

		  const durationText = formatDuration();
		  document.getElementById('duration-counter').innerHTML =
		    `我们已经陪伴您 <strong>${durationText}</strong>！`;
		</script>
